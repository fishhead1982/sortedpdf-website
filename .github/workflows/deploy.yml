name: Deploy to Cloudflare

# Builds the Astro site and deploys it to the Cloudflare Worker defined in
# wrangler.jsonc. Runs on every push to main, so the live site always matches
# the default branch — no manual `wrangler deploy` step.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN   API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  Account ID from the Cloudflare dashboard sidebar

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you redeploy by hand from the Actions tab

# Never let two deploys race; the newest push wins.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
